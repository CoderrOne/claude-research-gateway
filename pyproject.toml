[project]
name = "claude-research-gateway"
version = "1.0.0"
description = "MCP server enabling Claude to access paywalled scientific papers through institutional authentication"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # mcp 2.x renamed FastMCP, which server.py uses
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.10.0",
    "cryptography>=41.0.0",
    "pydantic>=2.5.0",
    "lxml>=4.9.0",
]

[project.scripts]
claude-research = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Install the dependencies only: server.py runs directly (see README), and
# hatchling cannot build a wheel from this flat layout.
package = false
